description: Promptfoo is an open-source LLM evaluation and red-teaming framework distributed as a TypeScript
  CLI and Node.js library under the MIT license. Developers use it to evaluate prompts, models, and RAG
  pipelines side by side, run automated red team attacks against LLM applications, scan code for LLM vulnerabilities
  in IDE and CI, and proxy Model Context Protocol traffic. Promptfoo also operates a commercial Enterprise
  platform at promptfoo.app for teams that need centralized governance, remediation reports, and shared
  evaluation history.
